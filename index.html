<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAINS CAR WASH</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: white;
        }

        .hero {

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0,0,0,0.48),
                    rgba(0,0,0,0.78)
                ),
                url("background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px 15px;

        }


        .card {

            width: 100%;
            max-width: 620px;

            text-align: center;

            padding: 55px 30px;

            background: rgba(0,0,0,0.58);

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 25px;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            box-shadow:
                0 20px 80px rgba(0,0,0,0.75);

        }


        .small-title {

            font-size: 12px;

            letter-spacing: 5px;

            color: #cfcfcf;

            text-transform: uppercase;

            margin-bottom: 18px;

        }


        h1 {

            font-size: clamp(45px, 10vw, 82px);

            line-height: 0.9;

            letter-spacing: 3px;

            font-weight: 900;

        }


        .line {

            width: 75px;

            height: 3px;

            background: white;

            margin: 25px auto;

        }


        .description {

            font-size: 16px;

            line-height: 1.7;

            color: #dddddd;

            margin-bottom: 32px;

        }


        .buttons {

            width: 100%;

            max-width: 410px;

            margin: auto;

            display: flex;

            flex-direction: column;

            gap: 14px;

        }


        .button {

            min-height: 58px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 12px;

            text-decoration: none;

            font-size: 16px;

            font-weight: 800;

            letter-spacing: 0.4px;

            transition: all 0.3s ease;

        }


        .button:hover {

            transform: translateY(-4px);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.6);

        }


        /* WHATSAPP */

        .whatsapp {

            background: white;

            color: black;

        }


        /* INSTAGRAM */

        .instagram {

            background: transparent;

            color: white;

            border: 1px solid rgba(255,255,255,0.75);

        }


        /* LOCATION */

        .location {

            background: transparent;

            color: white;

            border: 1px solid rgba(255,255,255,0.75);

        }


        .phone {

            margin-top: 25px;

            color: #bdbdbd;

            font-size: 14px;

            letter-spacing: 1.5px;

        }


        .footer {

            margin-top: 35px;

            color: #777;

            font-size: 10px;

            letter-spacing: 3px;

            text-transform: uppercase;

        }


        /* MOBILE */

        @media (max-width: 600px) {

            .hero {

                padding: 15px;

            }

            .card {

                padding: 45px 20px;

                border-radius: 20px;

            }

            h1 {

                font-size: 48px;

            }

            .description {

                font-size: 14px;

            }

        }

    </style>

</head>


<body>


<section class="hero">


    <div class="card">


        <div class="small-title">

            Premium Car Care

        </div>


        <h1>

            BAINS<br>

            CAR WASH

        </h1>


        <div class="line"></div>


        <p class="description">

            Clean Car. Fresh Look. Better Drive.<br>

            Professional car washing and care.

        </p>



        <div class="buttons">


            <!-- WHATSAPP -->

            <a

                class="button whatsapp"

                href="https://wa.me/917973468680"

                target="_blank"

                rel="noopener"

            >

                WhatsApp Us

            </a>



            <!-- INSTAGRAM -->

            <a

                class="button instagram"

                href="https://www.instagram.com/bains_carwash01/"

                target="_blank"

                rel="noopener"

            >

                Follow Us on Instagram

            </a>



            <!-- GOOGLE MAPS -->

            <a

                class="button location"

                href="https://maps.app.goo.gl/pZZb2WopRFrienxF8?g_st=aw"

                target="_blank"

                rel="noopener"

            >

                📍 Get Directions

            </a>


        </div>



        <div class="phone">

            +91 79 7346 8680

        </div>



        <div class="footer">

            BAINS CAR WASH

        </div>


    </div>


</section>


</body>

</html>
