<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAINS CAR WASH | Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            min-height: 100vh;
        }

        .hero {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0,0,0,0.55),
                    rgba(0,0,0,0.75)
                ),
                url("background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        .card {
            width: 100%;
            max-width: 600px;

            text-align: center;

            padding: 55px 30px;

            background: rgba(0,0,0,0.55);

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 25px;

            backdrop-filter: blur(8px);

            box-shadow:
                0 20px 70px rgba(0,0,0,0.7);
        }

        .small-title {
            font-size: 13px;

            letter-spacing: 5px;

            color: #cfcfcf;

            margin-bottom: 18px;

            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(45px, 9vw, 80px);

            line-height: 0.95;

            letter-spacing: 3px;

            font-weight: 900;

            text-transform: uppercase;
        }

        .line {
            width: 70px;
            height: 3px;

            background: white;

            margin: 25px auto;
        }

        .description {
            font-size: 16px;

            line-height: 1.7;

            color: #dddddd;

            margin-bottom: 35px;
        }

        .buttons {
            width: 100%;
            max-width: 400px;

            margin: auto;

            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .button {
            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 58px;

            padding: 15px 20px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            transition: 0.3s ease;
        }

        .whatsapp {
            background: white;

            color: black;
        }

        .instagram {
            background: transparent;

            color: white;

            border: 1px solid rgba(255,255,255,0.7);
        }

        .button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.5);
        }

        .phone {
            margin-top: 25px;

            color: #bbbbbb;

            font-size: 14px;

            letter-spacing: 1px;
        }

        .footer {
            margin-top: 35px;

            font-size: 11px;

            color: #777;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .hero {
                padding: 20px 15px;
            }

            .card {
                padding: 45px 20px;
            }

            h1 {
                font-size: 48px;
            }

            .description {
                font-size: 14px;
            }

        }

    </style>
</head>


<body>

    <section class="hero">

        <div class="card">

            <div class="small-title">
                Premium Car Care
            </div>


            <h1>
                BAINS<br>
                CAR WASH
            </h1>


            <div class="line"></div>


            <p class="description">

                Clean Car. Fresh Look. Better Drive.<br>

                Get in touch with Bains Car Wash.

            </p>


            <div class="buttons">


                <!-- WHATSAPP -->

                <a
                    class="button whatsapp"
                    href="https://wa.me/917973468680"
                    target="_blank"
                >

                    WhatsApp Us

                </a>



                <!-- INSTAGRAM -->

                <a
                    class="button instagram"
                    href="https://www.instagram.com/bains_carwash01/"
                    target="_blank"
                >

                    Follow Us on Instagram

                </a>


            </div>


            <div class="phone">

                +91 79 7346 8680

            </div>


            <div class="footer">

                BAINS CAR WASH

            </div>

        </div>

    </section>

</body>
</html>
